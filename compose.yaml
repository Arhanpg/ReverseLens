name: reverselens
services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: reverselens
      POSTGRES_USER: reverselens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reverselens -d reverselens"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  workspace-init:
    image: alpine:3.21
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /workspace && chown -R 10001:10001 /workspace"]
    volumes: [analysis-workspace:/workspace]
    networks: [backend]
    restart: "no"

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reverselens
      SPRING_DATASOURCE_USERNAME: reverselens
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
      SPRING_DATA_REDIS_HOST: redis
      REVERSE_LENS_WORKSPACE: /workspace
      REVERSE_LENS_WORKER_TOKEN: ${REVERSE_LENS_WORKER_TOKEN:-local-worker-token-change-me}
      REVERSE_LENS_FRONTEND_ORIGIN: http://localhost:3000
    volumes: [analysis-workspace:/workspace]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      workspace-init: { condition: service_completed_successfully }
    ports: ["8080:8080"]
    networks: [backend, frontend]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=128m,noexec,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 1.5

  worker:
    build: ./worker
    environment:
      REDIS_HOST: redis
      QUEUE_NAME: reverselens:analysis:jobs
      API_INTERNAL_URL: http://api:8080
      REVERSE_LENS_WORKER_TOKEN: ${REVERSE_LENS_WORKER_TOKEN:-local-worker-token-change-me}
      WORKSPACE_ROOT: /workspace
      LOG_LEVEL: INFO
    volumes: [analysis-workspace:/workspace]
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_started }
      workspace-init: { condition: service_completed_successfully }
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=512m,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 4g
    cpus: 2.0

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    depends_on: [api]
    ports: ["3000:3000"]
    networks: [frontend]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres-data:
  redis-data:
  analysis-workspace:

networks:
  backend:
    internal: true
  frontend:
