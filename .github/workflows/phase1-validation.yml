name: Phase 1 validation
on:
  push:
    branches: [feature/phase-1-android-mvp]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    name: Backend compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven verification
        run: mvn -B -f backend/pom.xml verify
  worker:
    name: Worker unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r worker/requirements.txt
          python -m pip install pytest
      - name: Run tests
        env:
          PYTHONPATH: worker
        run: python -m pytest worker/tests -q
  frontend:
    name: Frontend type check and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install and verify
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build

  worker-image:
    name: Build and verify pinned Android tool image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build worker image and verify installed tools
        run: docker build --pull -f worker/Dockerfile -t reverselens-worker:ci ./worker
